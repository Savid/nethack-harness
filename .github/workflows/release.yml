name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-musl
  SIZE_LIMIT: 1572864          # 1.5 MiB
jobs:
  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nuc, nethack-harness]
    permissions:
      contents: write          # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          echo "crate $version, tag $TAG"
          [ "v$version" = "$TAG" ]
      - run: cargo test --locked
      - run: rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/nethack-harness" dist/nethack-harness
          size=$(stat -c %s dist/nethack-harness)
          echo "nethack-harness: $size bytes (limit $SIZE_LIMIT)"
          [ "$size" -le "$SIZE_LIMIT" ]
          (cd dist && sha256sum nethack-harness > nethack-harness.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/nethack-harness dist/nethack-harness.sha256 --verify-tag --notes-from-tag --title "$TAG"
